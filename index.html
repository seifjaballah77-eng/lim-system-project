<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>محاكي LimSystem التفاعلي</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --blue:#58a6ff; --muted:#9da7b3; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      min-height:100vh; padding:28px 18px; display:flex; flex-direction:column;
      align-items:center; gap:18px; color:#f0f6fc; background:
      radial-gradient(ellipse at top, #17243a 0%, var(--bg) 58%);
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    }
    header { width:min(100%,960px); text-align:center; }
    h1 { margin:0 0 8px; font-size:clamp(1.35rem,4vw,2rem); color:var(--blue); }
    header p { margin:0; color:var(--muted); line-height:1.8; }
    .stage { width:min(100%,960px); padding:10px; border:1px solid var(--line); border-radius:18px; background:#111820; box-shadow:0 18px 55px #0005; }
    canvas { display:block; width:100%; height:min(68vh,620px); min-height:320px; border-radius:11px; background:
      radial-gradient(circle at center, #1b2635 0%, #111820 75%); touch-action:none; cursor:crosshair; }
    .toolbar { width:min(100%,960px); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
    label { color:var(--muted); display:flex; align-items:center; gap:10px; }
    input[type=range] { accent-color:var(--blue); width:140px; }
    button { border:1px solid #355b85; background:#183653; color:#f0f6fc; border-radius:10px; padding:10px 16px; font:inherit; cursor:pointer; }
    button:hover { background:#214b73; }
    .hint { width:min(100%,960px); color:var(--muted); font-size:.9rem; line-height:1.8; text-align:center; }
    .status { color:#7ee787; }
    @media (max-width:520px) { body{padding:18px 10px} .stage{padding:6px} canvas{min-height:360px;height:62vh} }
  </style>
</head>
<body>
  <header>
    <h1>محاكي المفاصل التفاعلي — LimSystem</h1>
    <p>حرّك مؤشر الفأرة داخل مساحة الرسم، أو المس الشاشة، لتوجيه رأس السلسلة.</p>
  </header>

  <main class="stage" aria-label="مساحة المحاكاة">
    <canvas id="canvas" aria-label="رسم تفاعلي لسلسلة من المفاصل"></canvas>
  </main>

  <section class="toolbar" aria-label="إعدادات المحاكاة">
    <label for="segments">عدد المفاصل <strong id="segmentsValue">20</strong>
      <input id="segments" type="range" min="5" max="40" value="20">
    </label>
    <label for="segmentLength">طول الجزء <strong id="lengthValue">18</strong>
      <input id="segmentLength" type="range" min="8" max="30" value="18">
    </label>
    <button id="reset" type="button">إعادة ضبط الحركة</button>
  </section>

  <p class="hint"><span class="status">● يعمل مباشرة في المتصفح</span> — لا يحتاج إلى مكتبات خارجية أو تثبيت.</p>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const segmentSlider = document.getElementById("segments");
      const lengthSlider = document.getElementById("segmentLength");
      const segmentsValue = document.getElementById("segmentsValue");
      const lengthValue = document.getElementById("lengthValue");

      const Input = { mouse: { x: 0, y: 0, active: false } };
      let system;
      let width = 0;
      let height = 0;
      let animationId = 0;

      class Node {
        constructor(x, y, length) {
          this.x = x;
          this.y = y;
          this.length = length;
          this.parent = null;
          this.isSegment = true;
        }
      }

      class LimSystem {
        constructor(count, segmentLength) {
          this.nodes = [];
          this.segmentLength = segmentLength;
          const startX = width / 2;
          const startY = height / 2;
          let parent = null;

          for (let i = 0; i < count; i++) {
            const node = new Node(startX - i * segmentLength, startY, segmentLength);
            node.parent = parent;
            this.nodes.push(node);
            parent = node;
          }
          this.length = this.nodes.length;
          this.hip = this.nodes[this.nodes.length - 1];
        }

        moveTo(targetX, targetY) {
          const head = this.nodes[0];
          head.x = targetX;
          head.y = targetY;

          for (let i = 1; i < this.nodes.length; i++) {
            const previous = this.nodes[i - 1];
            const current = this.nodes[i];
            const dx = current.x - previous.x;
            const dy = current.y - previous.y;
            const distance = Math.hypot(dx, dy) || 1;
            current.x = previous.x + (dx / distance) * current.length;
            current.y = previous.y + (dy / distance) * current.length;
          }
        }

        update() {
          if (Input.mouse.active) this.moveTo(Input.mouse.x, Input.mouse.y);
        }

        draw(context) {
          context.save();
          context.lineCap = "round";
          context.lineJoin = "round";

          context.beginPath();
          this.nodes.forEach((node, index) => {
            if (index === 0) context.moveTo(node.x, node.y);
            else context.lineTo(node.x, node.y);
          });
          context.strokeStyle = "#ff7b72";
          context.lineWidth = Math.max(3, Math.min(7, this.segmentLength * 0.34));
          context.stroke();

          this.nodes.forEach((node, index) => {
            context.beginPath();
            context.arc(node.x, node.y, index === 0 ? 8 : Math.max(3, 5 - index * 0.04), 0, Math.PI * 2);
            context.fillStyle = index === 0 ? "#7ee787" : (index === this.nodes.length - 1 ? "#58a6ff" : "#ffa657");
            context.fill();
          });

          const head = this.nodes[0];
          context.beginPath();
          context.arc(head.x, head.y, 16, 0, Math.PI * 2);
          context.strokeStyle = "#7ee78755";
          context.lineWidth = 2;
          context.stroke();
          context.restore();
        }
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const oldWidth = width;
        const oldHeight = height;
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (system && oldWidth && oldHeight) {
          const dx = (width - oldWidth) / 2;
          const dy = (height - oldHeight) / 2;
          system.nodes.forEach(node => { node.x += dx; node.y += dy; });
        } else {
          Input.mouse.x = width / 2;
          Input.mouse.y = height / 2;
        }
      }

      function setPointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        Input.mouse.x = Math.max(0, Math.min(width, event.clientX - rect.left));
        Input.mouse.y = Math.max(0, Math.min(height, event.clientY - rect.top));
        Input.mouse.active = true;
      }

      function resetSystem() {
        segmentsValue.textContent = segmentSlider.value;
        lengthValue.textContent = lengthSlider.value;
        system = new LimSystem(Number(segmentSlider.value), Number(lengthSlider.value));
        Input.mouse.x = width / 2;
        Input.mouse.y = height / 2;
        Input.mouse.active = false;
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        system.update();
        system.draw(ctx);
        animationId = requestAnimationFrame(animate);
      }

      canvas.addEventListener("pointermove", setPointerPosition);
      canvas.addEventListener("pointerdown", event => {
        setPointerPosition(event);
        if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointerleave", event => {
        if (event.pointerType === "mouse") Input.mouse.active = false;
      });
      segmentSlider.addEventListener("input", resetSystem);
      lengthSlider.addEventListener("input", resetSystem);
      document.getElementById("reset").addEventListener("click", resetSystem);
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      resetSystem();
      animate();

      window.addEventListener("pagehide", () => cancelAnimationFrame(animationId), { once: true });
    })();
  </script>
</body>
</html>
