<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b16">
<meta name="description" content="NEON SNAKE — لعبة أفعى نيون خفيفة مع منافس ذكي."><title>NEON SNAKE — LimSystem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&display=swap');
:root{color-scheme:dark;--cyan:#65f6ff;--pink:#ff4e8a;--glass:#09142cdd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:#eff8ff;font-family:Changa,system-ui,sans-serif;overscroll-behavior:none}#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(10px,2.5vw,24px);z-index:2}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand{font-size:clamp(20px,4vw,30px);font-weight:800;line-height:1.2}.brand span{color:var(--cyan)}.sub{font-size:11px;color:#92a9cb}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:62px;padding:6px 10px;border:1px solid #87cfff2c;border-radius:12px;background:#09142cbb;text-align:center}.stat small{display:block;color:#9cb3d3;font-size:10px}.stat b{font-size:18px}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;color:#9cb3d3;font-size:12px}.btn{pointer-events:auto;border:1px solid #65f6ff66;color:#eafcff;background:#0b2037e8;border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.btn:active{transform:scale(.97)}.screen{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#050916b8;padding:20px}.panel{width:min(420px,100%);text-align:center;border:1px solid #65f6ff55;border-radius:22px;padding:25px 22px;background:linear-gradient(145deg,#0d1b33f5,#080d1bf5);box-shadow:0 0 35px #23d9ff12}.panel h1{margin:0;font-size:clamp(28px,8vw,42px);letter-spacing:1px}.panel h1 span{color:var(--cyan)}.panel p{color:#a8bdd9;line-height:1.9;font-size:14px}.panel .btn{width:100%;margin-top:8px;background:#0c3447}.panel select{width:100%;margin:8px 0;padding:10px;border-radius:10px;background:#09142c;color:#eff8ff;border:1px solid #65f6ff55;font:inherit}.ability{position:fixed;z-index:3;top:92px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:#09142cdd;border:1px solid #65f6ff55;color:#65f6ff;font-size:12px;pointer-events:none;white-space:nowrap}.hide{display:none!important}.toast{position:fixed;z-index:8;top:64px;left:50%;transform:translateX(-50%);background:#09251dcc;border:1px solid #a4ff6755;color:#caff9c;padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}@media(max-width:520px){.hud{padding:12px}.stat{min-width:53px;padding:5px 7px}.stat b{font-size:16px}.brand{font-size:22px}.sub{font-size:10px}.bottom{font-size:11px}.desktop{display:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="لعبة الأفعى"></canvas>
<div class="hud"><div class="top"><div><div class="brand">NEON <span>SNAKE</span></div><div class="sub">نسخة خفيفة • نيون مستقبلي</div></div><div class="stats"><div class="stat"><small>نقاطك</small><b id="score">0</b></div><div class="stat"><small>المنافس</small><b id="rivalScore">0</b></div><div class="stat"><small>أفضل نتيجة</small><b id="best">0</b></div></div></div><div class="bottom"><div id="hint">مرّر إصبعك في اتجاه الحركة لتغيير المسار</div><button class="btn" id="pause">إيقاف مؤقت</button></div></div>
<div class="ability hide" id="abilityStatus"></div><div class="toast hide" id="toast"></div><div class="screen" id="start"><div class="panel"><h1>NEON <span>SNAKE</span></h1><p>اجمع البلورات، استخدم القدرات، وتفوّق على الأفعى الحمراء.<br>مرّر إصبعك لتغيير الاتجاه.</p><label for="theme">الثيم</label><select id="theme"><option value="neon">نيون كلاسيكي</option><option value="tropical">مغامرة استوائية</option></select><label for="mode">طريقة اللعب</label><select id="mode"><option value="ai">ضد المنافس الذكي</option><option value="two">لاعبان على نفس الجهاز</option></select><label for="difficulty">مستوى المنافس</label><select id="difficulty"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="insane">مجنون</option></select><button class="btn" id="play">ابدأ اللعب</button></div></div>
<div class="screen hide" id="over"><div class="panel"><h1 id="overTitle">انتهت اللعبة</h1><p id="result"></p><button class="btn" id="again">العب مجددًا</button></div></div>
<div class="screen hide" id="paused"><div class="panel"><h1>توقف مؤقت</h1><p>خذ وقتك، ثم تابع التحدي.</p><button class="btn" id="resume">متابعة</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,cell=20,cols=20,rows=20,player=[],rival=[],player2=[],dir={x:1,y:0},nextDir={x:1,y:0},rdir={x:-1,y:0},dir2={x:0,y:-1},nextDir2={x:0,y:-1},food=null,foodKind='pineapple',pineappleRun=0,score=0,rscore=0,best=0,running=false,paused=false,ended=false,last=0,acc=0,stepMs=135,foodPulse=0,difficulty='medium',gameMode='ai',theme='neon',powerup=null,powerKind='',powerType='',powerUntil=0,freezeUntil=0,obstacles=[],portals=[],trail=[],shake=0,spawnPowerAt=0,eventType='',eventUntil=0,nextEventAt=0;
try{best=+(localStorage.getItem('neonSnakeBest')||0)}catch(e){}$('best').textContent=best;
function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cell=Math.max(14,Math.floor(Math.min(W/22,H/25)));cols=Math.max(12,Math.floor(W/cell));rows=Math.max(12,Math.floor(H/cell));if(!running)draw()}
window.addEventListener('resize',resize,{passive:true});
function reset(){difficulty=$('difficulty').value;theme=$('theme').value;gameMode=$('mode').value;document.body.classList.toggle('tropical',theme==='tropical');const cx=Math.floor(cols*.28),cy=Math.floor(rows*.5),rx=Math.floor(cols*.72);player=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];player2=[{x:Math.floor(cols*.28),y:Math.floor(rows*.72)},{x:Math.floor(cols*.28),y:Math.floor(rows*.72)+1},{x:Math.floor(cols*.28),y:Math.floor(rows*.72)+2}];rival=[{x:rx,y:cy},{x:rx+1,y:cy},{x:rx+2,y:cy}];dir={x:1,y:0};nextDir={...dir};dir2={x:0,y:-1};nextDir2={...dir2};rdir={x:-1,y:0};score=0;rscore=0;pineappleRun=0;eventType='';eventUntil=0;nextEventAt=performance.now()+30000;powerup=null;powerKind='';powerType='';powerUntil=0;freezeUntil=0;trail=[];shake=0;spawnPowerAt=performance.now()+7000;stepMs=Math.max(95,Math.min(145,cell*6));food=null;spawnFood();makeArena();updateHUD();acc=0;last=0;ended=false;paused=false;running=true;$('start').classList.add('hide');$('over').classList.add('hide');$('paused').classList.add('hide');$('pause').textContent='إيقاف مؤقت';requestAnimationFrame(loop)}
function occupied(x,y){return player.some(p=>p.x===x&&p.y===y)||(gameMode==='two'&&player2.some(p=>p.x===x&&p.y===y))||rival.some(p=>p.x===x&&p.y===y)||obstacles.some(p=>p.x===x&&p.y===y)}
function makeArena(){obstacles=[];portals=[];if(cols>=16&&rows>=15){const y=Math.floor(rows*.35),x=Math.floor(cols*.5);obstacles=[{x:x-1,y,phase:0},{x:x,y,phase:1},{x:x+1,y,phase:2}];portals=[{x:1,y:Math.floor(rows*.25)},{x:cols-2,y:Math.floor(rows*.75)}]}}
function spawnPower(){if(powerup||performance.now()<spawnPowerAt)return;let p,tries=0;do{p={x:2+Math.floor(Math.random()*Math.max(1,cols-4)),y:2+Math.floor(Math.random()*Math.max(1,rows-4))};tries++}while(occupied(p.x,p.y)&&tries<100);powerup=p;powerKind=['freeze','ghost','turbo','rare'][Math.floor(Math.random()*4)];spawnPowerAt=performance.now()+12000}
function activatePower(type){const now=performance.now();powerType=type;powerUntil=now+(type==='rare'?9000:6000);shake=type==='rare'?7:3;if(type==='freeze')freezeUntil=now+4000;if(type==='turbo')stepMs=Math.max(65,stepMs*.68);$('abilityStatus').textContent=({freeze:'❄ تجميد المنافس',ghost:'👻 وضع الشبح',turbo:'⚡ سرعة خارقة',rare:'💎 بلورة نادرة +20'})[type]||'قدرة مفعّلة';$('abilityStatus').classList.remove('hide');if(type==='rare'){score+=20;updateHUD()}}
function spawnFood(){let tries=0;do{food={x:2+Math.floor(Math.random()*Math.max(1,cols-4)),y:3+Math.floor(Math.random()*Math.max(1,rows-6))};tries++}while(occupied(food.x,food.y)&&tries<500);foodKind=['pineapple','watermelon','banana'][Math.floor(Math.random()*3)]}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hide'),1900)}
function fieldEvent(now){if(now<nextEventAt)return;eventType=Math.random()<.5?'rain':'shrink';eventUntil=now+5000;nextEventAt=now+30000;toast(eventType==='rain'?'🌧 عاصفة نيون! فواكه كثيرة':'🚨 المنطقة تضيق!');if(eventType==='rain'){for(let i=0;i<7;i++){food={x:2+Math.floor(Math.random()*Math.max(1,cols-4)),y:2+Math.floor(Math.random()*Math.max(1,rows-4))};foodKind=['pineapple','watermelon','banana'][Math.floor(Math.random()*3)]}}}
function moveHead(s,d){return {x:(s[0].x+d.x+cols)%cols,y:(s[0].y+d.y+rows)%rows}}
function updateHUD(){$('score').textContent=score;$('rivalScore').textContent=rscore;$('best').textContent=best}
function setDirection(x,y){if(x===-dir.x&&y===-dir.y)return;nextDir={x,y}}
function steer(x,y){const dx=x-dir.x,dy=y-dir.y;if(dx===0&&dy===0)return;if(x===-dir.x&&y===-dir.y)return;nextDir={x,y}}
function rivalMove(){if(performance.now()<freezeUntil)return;const head=rival[0];let target=powerup&&Math.random()<.45?powerup:food;if(!target)return;let opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!(d.x===-rdir.x&&d.y===-rdir.y));const safe=opts.filter(d=>{const x=(head.x+d.x+cols)%cols,y=(head.y+d.y+rows)%rows;return !rival.some((p,i)=>i<rival.length-1&&p.x===x&&p.y===y)&&!player.some((p,i)=>i<player.length-1&&p.x===x&&p.y===y)});if(!safe.length){rdir=opts[Math.floor(Math.random()*opts.length)]||rdir;return}safe.sort((a,b)=>distance((head.x+a.x+cols)%cols,(head.y+a.y+rows)%rows,target)-distance((head.x+b.x+cols)%cols,(head.y+b.y+rows)%rows,target));const chance=difficulty==='easy'?.25:difficulty==='insane'?.88:.58;const choice=Math.random()<chance?safe[0]:safe[Math.floor(Math.random()*safe.length)];rdir=choice}
function distance(x,y,t){return Math.abs(x-t.x)+Math.abs(y-t.y)}
function tick(){const now=performance.now();fieldEvent(now);if(eventType&&now>=eventUntil)eventType='';if(powerType&&now>powerUntil){if(powerType==='turbo')stepMs=Math.min(145,stepMs/0.68);powerType='';$('abilityStatus').classList.add('hide')}if(!powerup&&now>=spawnPowerAt)spawnPower();dir=nextDir;rivalMove();let h={x:(player[0].x+dir.x+cols)%cols,y:(player[0].y+dir.y+rows)%rows};let h2=gameMode==='two'?moveHead(player2,nextDir2):null;let rh={x:(rival[0].x+rdir.x+cols)%cols,y:(rival[0].y+rdir.y+rows)%rows};const portal=portals.find(p=>p.x===h.x&&p.y===h.y);if(portal){const other=portals.find(p=>p!==portal);h={x:other.x,y:other.y}}const rportal=portals.find(p=>p.x===rh.x&&p.y===rh.y);if(rportal){const other=portals.find(p=>p!==rportal);rh={x:other.x,y:other.y}}if(player.some((p,i)=>i<player.length-1&&p.x===h.x&&p.y===h.y)||(gameMode==='two'&&player2.some(p=>p.x===h.x&&p.y===h.y))||obstacles.some(p=>p.x===h.x&&p.y===h.y)||((powerType!=='ghost'||now>powerUntil)&&rival.some((p,i)=>p.x===h.x&&p.y===h.y))||(h.x===rh.x&&h.y===rh.y)){finish('اصطدمت أفعاك!');return}
player.unshift(h);if(gameMode==='two'){dir2=nextDir2;player2.unshift(h2);if(player2.some((p,i)=>i>0&&p.x===h2.x&&p.y===h2.y)||player.some((p,i)=>i>0&&p.x===h2.x&&p.y===h2.y)){player2.shift();nextDir2={...dir2}}if(food&&h2.x===food.x&&h2.y===food.y){rscore+=10;spawnFood()}else player2.pop()}trail.push({x:h.x,y:h.y,t:now});if(trail.length>70)trail.shift();if(food&&h.x===food.x&&h.y===food.y){if(foodKind==='pineapple'){score+=300;player.push({...player[player.length-1]});player.push({...player[player.length-1]});pineappleRun++;if(pineappleRun>=5){toast('🏆 5 أناناسات متتالية!');pineappleRun=0}}else if(foodKind==='watermelon'){score+=10;if(player.length>3)player.splice(-2,1);pineappleRun=0}else{score+=10;powerType='turbo';powerUntil=now+4000;stepMs=Math.max(60,stepMs*.65);toast('🍌 اندفاع سريع!')}stepMs=Math.max(75,stepMs-1);shake=2;spawnFood()}else player.pop();if(powerup&&h.x===powerup.x&&h.y===powerup.y){const got=powerKind;powerup=null;powerKind='';activatePower(got);spawnPowerAt=now+10000}
if(rival.some((p,i)=>i<rival.length-1&&p.x===rh.x&&p.y===rh.y)||player.some((p,i)=>i<player.length-1&&p.x===rh.x&&p.y===rh.y)||obstacles.some(p=>p.x===rh.x&&p.y===rh.y)){rscore=Math.max(0,rscore-5);for(let i=0;i<3;i++){const drop={x:(rh.x+i+cols)%cols,y:rh.y};if(!occupied(drop.x,drop.y))food=drop}rival=[{x:Math.floor(cols*.72),y:Math.floor(rows*.25)},{x:(Math.floor(cols*.72)+1)%cols,y:Math.floor(rows*.25)},{x:(Math.floor(cols*.72)+2)%cols,y:Math.floor(rows*.25)}];rdir={x:-1,y:0};shake=4}else{rival.unshift(rh);if(food&&rh.x===food.x&&rh.y===food.y){rscore+=10;spawnFood()}else rival.pop();if(powerup&&rh.x===powerup.x&&rh.y===powerup.y){powerup=null;freezeUntil=0;rscore+=5;spawnPowerAt=now+14000}}
if(score>best){best=score;try{localStorage.setItem('neonSnakeBest',best)}catch(e){}}updateHUD()}
function finish(msg){running=false;ended=true;$('overTitle').textContent='انتهت الجولة';$('result').textContent=msg+' — نقاطك: '+score+' | نقاط المنافس: '+rscore;$('over').classList.remove('hide')}
function loop(t){if(!running||paused)return;if(!last)last=t;acc+=Math.min(50,t-last);last=t;while(acc>=stepMs){tick();acc-=stepMs;if(!running)return}draw();requestAnimationFrame(loop)}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82;if(shake<.3)shake=0}ctx.fillStyle=theme==='tropical'?'#031b13':'#070b16';ctx.fillRect(0,0,W,H);const cw=W/cols,ch=H/rows;ctx.strokeStyle='rgba(95,170,220,.055)';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,H);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(W,y*ch);ctx.stroke()}
if(food){const x=(food.x+.5)*cw,y=(food.y+.5)*ch;const fruit={pineapple:'🍍',watermelon:'🍉',banana:'🍌'}[foodKind]||'◆';ctx.font=Math.max(15,Math.min(cw,ch)*.9)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=theme==='tropical'?'#a7ff3f':'#65f6ff';ctx.shadowBlur=10;ctx.fillText(fruit,x,y);ctx.shadowBlur=0}
for(const o of obstacles){const blink=.65+.25*Math.sin(performance.now()/350+o.phase);ctx.fillStyle='rgba(255,78,138,'+blink+')';ctx.shadowColor='#ff4e8a';ctx.shadowBlur=5;ctx.fillRect(o.x*cw+2,o.y*ch+2,cw-4,ch-4);ctx.shadowBlur=0}for(const p of portals){ctx.strokeStyle='#b89aff';ctx.lineWidth=2;ctx.shadowColor='#b89aff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc((p.x+.5)*cw,(p.y+.5)*ch,Math.min(cw,ch)*.38,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}if(powerup){const colors={freeze:'#75dfff',ghost:'#c6a0ff',turbo:'#ffcf5e',rare:'#fff17a'};ctx.fillStyle=colors[powerKind]||'#fff17a';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc((powerup.x+.5)*cw,(powerup.y+.5)*ch,Math.min(cw,ch)*.28,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(let i=0;i<trail.length;i++){const t=trail[i],alpha=(i/trail.length)*.22;ctx.fillStyle='rgba(101,246,255,'+alpha+')';ctx.fillRect(t.x*cw+cw*.3,t.y*ch+ch*.3,cw*.4,ch*.4)}if(eventType==='shrink'){ctx.strokeStyle='#ff354f';ctx.lineWidth=5;ctx.shadowColor='#ff354f';ctx.shadowBlur=12;ctx.strokeRect(cw*2,ch*2,W-cw*4,H-ch*4);ctx.shadowBlur=0}drawSnake(rival,theme==='tropical'?'#ff9b42':'#ff4e8a',theme==='tropical'?'#ffd0a1':'#ff7ca9',cw,ch);drawSnake(player2,'#c6a0ff','#e3d0ff',cw,ch);drawSnake(player,theme==='tropical'?'#a7ff3f':'#65f6ff',theme==='tropical'?'#d7ff9c':'#b6fcff',cw,ch);ctx.restore()}
function drawSnake(s,color,headColor,cw,ch){for(let i=s.length-1;i>=0;i--){const p=s[i],pad=Math.max(2,cw*.12),x=p.x*cw+pad,y=p.y*ch+pad,w=cw-pad*2,h=ch-pad*2;ctx.fillStyle=color;ctx.globalAlpha=Math.max(.45,1-i*.018);if(i===0){ctx.shadowColor=color;ctx.shadowBlur=7;ctx.fillStyle=headColor}roundRect(x,y,w,h,Math.min(6,cw*.22));ctx.fill();ctx.shadowBlur=0}ctx.globalAlpha=1}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
let startX=0,startY=0,lastX=0,lastY=0,swiping=false;
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;startX=lastX=e.clientX;startY=lastY=e.clientY;swiping=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}},{passive:true});
canvas.addEventListener('pointermove',e=>{if(!swiping)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;const threshold=Math.max(12,Math.min(24,cell*.8));if(Math.max(Math.abs(dx),Math.abs(dy))>=threshold){if(Math.abs(dx)>Math.abs(dy))steer(dx>0?1:-1,0);else steer(0,dy>0?1:-1);lastX=e.clientX;lastY=e.clientY}},{passive:true});
canvas.addEventListener('pointerup',e=>{if(!swiping)return;swiping=false;const dx=e.clientX-startX,dy=e.clientY-startY;const threshold=18;if(Math.max(Math.abs(dx),Math.abs(dy))>=threshold){if(Math.abs(dx)>Math.abs(dy))steer(dx>0?1:-1,0);else steer(0,dy>0?1:-1)}},{passive:true});canvas.addEventListener('pointercancel',()=>swiping=false,{passive:true});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();if(k==='arrowup')steer(0,-1);if(k==='arrowdown')steer(0,1);if(k==='arrowleft')steer(-1,0);if(k==='arrowright')steer(1,0);if(gameMode==='two'){if(k==='w'&&!(dir2.x===0&&dir2.y===1))nextDir2={x:0,y:-1};if(k==='s'&&!(dir2.x===0&&dir2.y===-1))nextDir2={x:0,y:1};if(k==='a'&&!(dir2.x===1&&dir2.y===0))nextDir2={x:-1,y:0};if(k==='d'&&!(dir2.x===-1&&dir2.y===0))nextDir2={x:1,y:0}}else{if(k==='w')steer(0,-1);if(k==='s')steer(0,1);if(k==='a')steer(-1,0);if(k==='d')steer(1,0)}if(k===' '&&running)togglePause()});
function togglePause(){if(!running)return;paused=!paused;$('paused').classList.toggle('hide',!paused);$('pause').textContent=paused?'متابعة':'إيقاف مؤقت';if(!paused){last=0;requestAnimationFrame(loop)}}
$('play').addEventListener('click',reset);$('again').addEventListener('click',reset);$('pause').addEventListener('click',togglePause);$('resume').addEventListener('click',togglePause);resize();draw();
})();
</script>
</body></html>
