name: Validate NEON RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", html, re.I)
          inline = [s.strip() for s in scripts if s.strip()]
          assert inline, "No inline game script found"
          Path("/tmp/game.js").write_text(inline[-1], encoding="utf-8")
          assert 'id="game"' in html and 'id="startBtn"' in html
          assert "three.min.js" in html and "function collect(c)" in html
          print(f"HTML smoke checks passed; {len(inline[-1])} chars of inline JavaScript")
          PY
          node --check /tmp/game.js
      - name: Check required game interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = ["function start()", "function pause()", "function finish(win)", "function move(dt,t)", "function world(dt,t)", "data-key=\"KeyW\"", "localStorage.setItem"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing game features: " + ", ".join(missing))
          print("Game interaction smoke checks passed")
          PY
